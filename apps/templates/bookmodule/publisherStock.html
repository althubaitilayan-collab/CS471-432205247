<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Publisher Stock</title>
</head>
<body>
  <h1>Publishers and Total Book Stock</h1>
  <table border="1" cellpadding="8">
    <tr>
      <th>Publisher Name</th>
      <th>Location</th>
      <th>Total Book Stock</th>
    </tr>
    {% for publisher in publishers %}
    <tr>
      <td>{{ publisher.name }}</td>
      <td>{{ publisher.location }}</td>
      <td>{% if publisher.total_stock %}{{ publisher.total_stock }}{% else %}0{% endif %}</td>
    </tr>
    {% empty %}
    <tr>
      <td colspan="3">No publishers found in the database.</td>
    </tr>
    {% endfor %}
  </table>
</body>
</html>
