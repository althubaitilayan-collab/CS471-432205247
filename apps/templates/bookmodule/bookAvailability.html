<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Book Availability</title>
</head>
<body>
  <h1>Books Availability Percentage</h1>
  <table border="1" cellpadding="8">
    <tr>
      <th>Title</th>
      <th>Quantity</th>
      <th>Availability Percentage</th>
    </tr>
    {% for book in books %}
    <tr>
      <td>{{ book.title }}</td>
      <td>{{ book.quantity }}</td>
      <td>{{ book.availability_percentage }}%</td>
    </tr>
    {% empty %}
    <tr>
      <td colspan="3">No books found in the database.</td>
    </tr>
    {% endfor %}
  </table>
</body>
</html>
